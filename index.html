<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة التقارير اليومية - شركة أوراق المعرفة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #8b1e19;
            --brand-secondary: #5a100d;
            --brand-accent: #d97706;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); font-size: 14.5px; padding: 15px 10px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            border-radius: 12px; padding: 25px 20px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-lg); margin-bottom: 25px; border-bottom: 5px solid var(--brand-accent); color: white;
        }
        .brand-text { text-align: right; }
        .brand-text h1 { font-size: 20px; font-weight: 800; margin-bottom: 5px; }
        .brand-text h2 { color: #fde047; font-size: 12px; font-weight: 700; }
        .brand-logo { width: 60px; height: 60px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 5px; flex-shrink: 0; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 25px 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border-color); }
        .section-title { font-size: 16px; font-weight: 800; color: var(--brand-primary); margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }
        select, input, textarea { width: 100%; padding: 12px; border: 1.5px solid var(--border-color); border-radius: 8px; font-family: 'Cairo'; background-color: #f8fafc; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; color: white; margin-bottom: 12px; }
        .btn-checkin { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-checkout { background: linear-gradient(135deg, #334155, #0f172a); }
        .btn-submit { background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); margin-top: 10px; padding: 16px;}
        .status-text { padding: 12px; border-radius: 8px; text-align: center; margin-top: 10px; border: 1.5px dashed var(--border-color); background: #ffffff; color: #64748b; font-weight: 700;}
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; color: white; font-weight: 800; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.2); border-radius: 50%; border-top-color: var(--brand-accent); animation: spin 0.8s infinite linear; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingOverlay"><div class="spinner"></div><div>جاري معالجة وتوثيق البيانات...</div></div>
    
    <!-- الـ iframe المخفي لمعالجة مشاكل الإرسال من الجيت هب -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <div class="container">
        <div class="header">
            <div class="brand-text">
                <h1>شركة أوراق المعرفة</h1>
                <h2>IT TECHNICAL SUPPORT</h2>
                <p>مشروع أمانة بغداد - الجباية الإلكترونية</p>
            </div>
            <div class="brand-logo">
                <svg viewBox="0 0 300 300" width="50" height="50"><g fill="#8b1e19"><path d="M150 15 C135 55 125 90 150 128 C175 90 165 55 150 15 Z"/><path d="M150 22 L150 120" stroke="#ffffff" stroke-width="3" fill="none"/><path d="M150 128 C115 95 105 50 128 30 C100 65 110 110 150 128 Z"/><path d="M150 128 C185 95 195 50 172 30 C200 65 190 110 150 128 Z"/></g></svg>
            </div>
        </div>

        <form id="dailyReportForm" onsubmit="handleFormSubmit(event)">
            <!-- 1. الحضور والتواجد -->
            <div class="card">
                <div class="section-title">📍 الحضور والتواجد الميداني</div>
                <div class="form-group">
                    <label>اسم مهندس الدعم الفني *</label>
                    <select id="employeeName" required onchange="saveEmp()">
                        <option value="">اختر اسم المهندس...</option>
                        <option value="أحمد حكيم جاسم">أحمد حكيم جاسم</option>
                        <option value="زيد أسامة">زيد أسامة</option>
                        <option value="سجاد جمعة رحيم">سجاد جمعة رحيم</option>
                        <option value="حيدر عبد الكريم">حيدر عبد الكريم</option>
                        <option value="علي قاسم">علي قاسم</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>البلدية الميدانية *</label>
                    <select id="municipality" required>
                        <option value="">اختر البلدية التابع لها...</option>
                        <option value="بلدية الرصافة">بلدية الرصافة</option>
                        <option value="بلدية الغدير">بلدية الغدير</option>
                        <option value="بلدية الأعظمية">بلدية الأعظمية</option>
                        <option value="بلدية الشعب">بلدية الشعب</option>
                        <option value="بلدية الكرادة">بلدية الكرادة</option>
                        <option value="بلدية الكاظمية">بلدية الكاظمية</option>
                        <option value="بلدية الدورة">بلدية الدورة</option>
                        <option value="بلدية الرشيد">بلدية الرشيد</option>
                        <option value="بلدية المنصور">بلدية المنصور</option>
                        <option value="بلدية بغداد الجديدة">بلدية بغداد الجديدة</option>
                    </select>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>تاريخ العمل</label><input type="date" id="workDate" required readonly style="background:#e2e8f0;"></div>
                    <div class="form-group"><label>حالة الدوام</label><input type="text" id="workStatusBadge" value="قيد التسجيل" readonly style="color:#0284c7; font-weight:800; text-align:center; background:#eff6ff;"></div>
                </div>
                <button type="button" class="btn btn-checkin" onclick="doCheckIn()">📡 تسجيل الحضور الصباحي (GPS)</button>
                <button type="button" class="btn btn-checkout" onclick="doCheckOut()">🏠 تسجيل الانصراف الرسمي (GPS)</button>
                <div class="status-text" id="locationStatusText">📌 يرجى الضغط أعلاه لتثبيت الموقع الجغرافي.</div>
            </div>

            <!-- 2. إحصائيات الصيانة -->
            <div class="card">
                <div class="section-title">⚙️ إحصائيات الصيانة والأعطال</div>
                <div class="grid-2">
                    <div class="form-group"><label>المشاكل المحلولة *</label><input type="number" id="resolvedIssues" min="0" value="0" required></div>
                    <div class="form-group"><label>المشاكل المعلقة *</label><input type="number" id="pendingIssues" min="0" value="0" required></div>
                </div>
                <div class="form-group"><label>تصنيف الأعطال المعالجة</label><input type="text" id="issueTypes" placeholder="مثال: طابعات، تابلت، كابلات شبكة..."></div>
            </div>

            <!-- 3. العهد -->
            <div class="card">
                <div class="section-title">📦 إدارة حركة العهد الميدانية</div>
                <div class="grid-2">
                    <div class="form-group"><label>تابلت (مستلم/سحب)</label><input type="number" id="receivedTablets" min="0" value="0"></div>
                    <div class="form-group"><label>تابلت (مسلّم/جديد)</label><input type="number" id="deliveredTablets" min="0" value="0"></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>طابعات (مستلم/سحب)</label><input type="number" id="receivedPrinters" min="0" value="0"></div>
                    <div class="form-group"><label>طابعات (مسلّم/جديد)</label><input type="number" id="deliveredPrinters" min="0" value="0"></div>
                </div>
                <div class="grid-2">
                    <div class="form-group"><label>الفيستات المسلمة (يلك)</label><input type="number" id="vestsDelivered" min="0" value="0"></div>
                    <div class="form-group"><label>القبعات المسلمة (كاب)</label><input type="number" id="capsDelivered" min="0" value="0"></div>
                </div>
                <div class="form-group"><label>تفاصيل السيريال/الأجهزة</label><input type="text" id="assetsDetails" placeholder="أدخل أرقام السيريال للأجهزة المستبدلة..."></div>
            </div>

            <!-- 4. التفاصيل الختامية -->
            <div class="card">
                <div class="section-title">📝 تفاصيل الإنجاز والملاحظات</div>
                <div class="form-group"><label>الأعمال والصيانة المنفذة *</label><textarea id="dailyTasks" rows="3" required placeholder="وصف دقيق للأعمال المنجزة اليوم..."></textarea></div>
                <div class="form-group"><label>أسباب التعليق (إن وجدت)</label><textarea id="pendingReason" rows="2"></textarea></div>
                <div class="grid-2">
                    <div class="form-group"><label>مشكلة حرجة لغد؟</label><select id="criticalIssue"><option value="لا">لا</option><option value="نعم">نعم</option></select></div>
                    <div class="form-group"><label>متطلبات البلدية</label><input type="text" id="municipalityNeeds"></div>
                </div>
                <div class="form-group"><label>ملاحظات إضافية</label><input type="text" id="notes"></div>
                <button type="submit" class="btn btn-submit">🚀 إرسال التقرير النهائي واعتماد اليوم</button>
            </div>
        </form>
    </div>

    <script>
        // رابط الـ Web App الخاص بك في جوجل
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz8WWzNg7anoSKyY75FPaqTWNs59My0XbjsIu14qS06G1v9YL5fIeFDjCYEGSp3BPrf/exec";

        window.onload = function() {
            var today = new Date();
            var localDate = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            document.getElementById('workDate').value = localDate;
            var savedEmp = localStorage.getItem('kp_saved_emp');
            if(savedEmp) document.getElementById('employeeName').value = savedEmp;
        };

        function saveEmp() {
            var emp = document.getElementById('employeeName').value;
            if(emp) localStorage.setItem('kp_saved_emp', emp);
        }

        function setStatus(msg, color, bgColor, borderColor) {
            var box = document.getElementById('locationStatusText');
            box.innerHTML = msg; box.style.color = color; box.style.backgroundColor = bgColor; box.style.borderColor = borderColor;
        }

        // الإرسال المخفي (iframe) لتجنب أخطاء GitHub
        function sendViaIframe(payload, successMsg) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            var form = document.createElement('form');
            form.action = SCRIPT_URL;
            form.method = 'POST';
            form.target = 'hidden_iframe';
            
            for (var key in payload) {
                var input = document.createElement('input');
                input.type = 'hidden'; input.name = key; input.value = payload[key];
                form.appendChild(input);
            }
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            
            // محاكاة الانتظار لتأكيد الإرسال
            setTimeout(function() {
                document.getElementById('loadingOverlay').style.display = 'none';
                setStatus(successMsg, '#059669', '#ecfdf5', '#34d399');
            }, 3000);
        }

        // تسجيل الحضور
        function doCheckIn() {
            var emp = document.getElementById('employeeName').value;
            var mun = document.getElementById('municipality').value;
            var date = document.getElementById('workDate').value;
            if(!emp || !mun) { setStatus("❌ يرجى اختيار اسم المهندس والبلدية أولاً!", "#dc2626", "#fef2f2", "#f87171"); return; }

            document.getElementById('loadingOverlay').style.display = 'flex';
            navigator.geolocation.getCurrentPosition(function(pos) {
                document.getElementById('loadingOverlay').style.display = 'none';
                var mapUrl = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
                var timeStr = new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
                
                sendViaIframe({
                    action: 'checkIn', employeeName: emp, municipality: mun, workDate: date, checkInTime: timeStr, locationUrl: mapUrl
                }, "🟢 تم تثبيت الحضور الصباحي بنجاح للإكسل.");
                
                document.getElementById('workStatusBadge').value = "حضور مثبت (" + timeStr + ")";
            }, function() { document.getElementById('loadingOverlay').style.display = 'none'; setStatus("❌ يرجى تفعيل الـ GPS.", "#dc2626", "#fef2f2", "#f87171"); }, {enableHighAccuracy: true});
        }

        // تسجيل الانصراف
        function doCheckOut() {
            var emp = document.getElementById('employeeName').value;
            var date = document.getElementById('workDate').value;
            var mun = document.getElementById('municipality').value;
            if(!emp) { setStatus("❌ يرجى اختيار اسم المهندس أولاً!", "#dc2626", "#fef2f2", "#f87171"); return; }

            document.getElementById('loadingOverlay').style.display = 'flex';
            navigator.geolocation.getCurrentPosition(function(pos) {
                document.getElementById('loadingOverlay').style.display = 'none';
                var mapUrl = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
                var timeStr = new Date().toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
                
                sendViaIframe({
                    action: 'checkOut', employeeName: emp, workDate: date, municipality: mun, checkOutTime: timeStr, locationUrl: mapUrl
                }, "🏠 تم تسجيل الانصراف الميداني بنجاح للإكسل.");
                
                document.getElementById('workStatusBadge').value = "تم الانصراف (" + timeStr + ")";
            }, function() { document.getElementById('loadingOverlay').style.display = 'none'; setStatus("❌ يرجى تفعيل الـ GPS.", "#dc2626", "#fef2f2", "#f87171"); }, {enableHighAccuracy: true});
        }

        // التقرير النهائي
        function handleFormSubmit(e) {
            e.preventDefault();
            var emp = document.getElementById('employeeName').value;
            if(!emp) return;

            var data = {
                action: 'submitReport',
                employeeName: emp, municipality: document.getElementById('municipality').value, workDate: document.getElementById('workDate').value,
                resolvedIssues: document.getElementById('resolvedIssues').value, pendingIssues: document.getElementById('pendingIssues').value,
                issueTypes: document.getElementById('issueTypes').value, receivedTablets: document.getElementById('receivedTablets').value,
                deliveredTablets: document.getElementById('deliveredTablets').value, receivedPrinters: document.getElementById('receivedPrinters').value,
                deliveredPrinters: document.getElementById('deliveredPrinters').value, vestsDelivered: document.getElementById('vestsDelivered').value,
                capsDelivered: document.getElementById('capsDelivered').value, assetsDetails: document.getElementById('assetsDetails').value,
                dailyTasks: document.getElementById('dailyTasks').value, pendingReason: document.getElementById('pendingReason').value,
                criticalIssue: document.getElementById('criticalIssue').value, municipalityNeeds: document.getElementById('municipalityNeeds').value,
                notes: document.getElementById('notes').value
            };

            sendViaIframe(data, "✅ تم إرسال التقرير لنظام التقارير، وتم إرسال نسخة PDF إلى إيميلك.");
            setTimeout(() => { document.getElementById('dailyReportForm').reset(); }, 4000);
        }
    </script>
</body>
</html>
